<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHBK Casino</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CHBK Casino</h1>

    <div id="login-section">
        <p>Connecte-toi pour récupérer tes Brundles !</p>
        <div class="buttons">
            <button id="btn-google-login" class="btn btn-secondary">🌐 Se connecter avec Google</button>
        </div>
        <p id="auth-message" class="error-msg"></p>
    </div>

    <div id="casino-section" class="hidden">
        <p>Bienvenue dans le temple, <span id="player-name" style="color: #f1c40f; font-weight: bold;">Joueur</span> ! 
           <button id="btn-logout" class="btn-small">Déconnexion</button>
        </p>
        
        <div class="balance-board">
            <h2>Solde : <span id="brundle-balance">...</span> Brundles</h2>
        </div>

        <div style="margin-bottom: 30px;">
            <button id="btn-claim-bonus" class="btn" style="background-color: #2ecc71; color: white;">🎁 Récupérer mes 2500 Brundles !</button>
            <p id="bonus-message" style="font-size: 0.9em; margin-top: 5px;"></p>
        </div>

        <h3>Jeux disponibles</h3>
        <div class="games-menu">
            <button id="btn-open-slot" class="btn btn-game active-game">🎰 Machine à sous</button>
            <button class="btn btn-game" disabled>🎡 Roulette (Bientôt)</button>
            <button class="btn btn-game" disabled>🃏 Blackjack (Bientôt)</button>
        </div>
    </div>

    <div id="slot-section" class="hidden">
        <button id="btn-back-lobby" class="btn-small" style="margin-bottom: 20px;">⬅ Retour au Lobby</button>
        <h2>Machine à Sous (5 Rouleaux)</h2>
        
        <div class="slot-machine">
            <div class="reels">
                <div class="reel" id="reel-1">🍒</div>
                <div class="reel" id="reel-2">🍒</div>
                <div class="reel" id="reel-3">🍒</div>
                <div class="reel" id="reel-4">🍒</div>
                <div class="reel" id="reel-5">🍒</div>
            </div>
            
            <div class="slot-controls">
                <label for="bet-amount">Mise :</label>
                <input type="number" id="bet-amount" value="100" min="10" step="10">
                <button id="btn-spin" class="btn spin-btn">JOUER</button>
            </div>
            <p id="slot-message" class="slot-msg">Prêt à tenter ta chance ?</p>
        </div>
    </div>

    <script type="module" src="app.js?v=3"></script>
</body>
</html>
